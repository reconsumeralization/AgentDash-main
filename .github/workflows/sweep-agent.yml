name: Sweep Agent - Automated Code Review

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to perform'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - security
          - performance
          - quality

env:
  NODE_VERSION: '18'
  SWEEP_REPORTS_DIR: 'sweep-reports'

jobs:
  sweep-analysis:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        scan-type: [security, quality, performance, accessibility]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          npm ci
          # Install additional tools for sweep agent
          npm install -g js-yaml
          npm install --save-dev eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
      
      - name: 🔍 Run Sweep Agent - ${{ matrix.scan-type }}
        run: |
          echo "Running ${{ matrix.scan-type }} analysis..."
          node sweep-agent.js --scan-type=${{ matrix.scan-type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_SCAN_TYPE: ${{ matrix.scan-type }}
      
      - name: 📊 Upload sweep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-reports-${{ matrix.scan-type }}
          path: ${{ env.SWEEP_REPORTS_DIR }}/
          retention-days: 30
      
      - name: 📈 Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read sweep report
            const reportPath = path.join('${{ env.SWEEP_REPORTS_DIR }}', 'sweep-report.json');
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              // Generate comment
              let comment = `## 🔍 Sweep Agent Analysis - ${{ matrix.scan-type }}\n\n`;
              comment += `**Files Scanned:** ${report.metrics.filesScanned}\n`;
              comment += `**Issues Found:** ${report.metrics.issuesFound}\n\n`;
              
              // Group issues by severity
              const issuesBySeverity = report.issues.reduce((acc, issue) => {
                if (!acc[issue.severity]) acc[issue.severity] = [];
                acc[issue.severity].push(issue);
                return acc;
              }, {});
              
              const severityEmojis = {
                critical: '🚨',
                high: '⚠️',
                medium: '⚡',
                warning: '💡',
                info: 'ℹ️'
              };
              
              Object.entries(issuesBySeverity).forEach(([severity, issues]) => {
                if (issues.length > 0) {
                  comment += `### ${severityEmojis[severity]} ${severity.toUpperCase()} (${issues.length})\n\n`;
                  
                  issues.slice(0, 10).forEach(issue => {
                    comment += `- **${issue.file}:${issue.line}** - ${issue.message}\n`;
                    if (issue.code) {
                      comment += `  \`\`\`${issue.code}\`\`\`\n`;
                    }
                  });
                  
                  if (issues.length > 10) {
                    comment += `- ... and ${issues.length - 10} more issues\n`;
                  }
                  comment += '\n';
                }
              });
              
              // Add summary
              comment += `### 📊 Summary\n\n`;
              comment += `${report.summary}\n\n`;
              
              comment += `---\n*Report generated by Sweep Agent on ${new Date().toISOString()}*`;
              
              // Post comment
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      
      - name: 🚨 Create security issues
        if: matrix.scan-type == 'security' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportPath = path.join('${{ env.SWEEP_REPORTS_DIR }}', 'sweep-report.json');
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const criticalIssues = report.issues.filter(issue => issue.severity === 'critical');
              const highIssues = report.issues.filter(issue => issue.severity === 'high');
              
              // Create issues for critical vulnerabilities
              for (const issue of criticalIssues.slice(0, 5)) {
                const title = `🚨 Security: ${issue.rule} in ${issue.file}`;
                const body = `
## Security Issue Detected

**Severity:** ${issue.severity.toUpperCase()}  
**File:** \`${issue.file}:${issue.line}\`  
**Rule:** ${issue.rule}  
**Message:** ${issue.message}

${issue.code ? `\`\`\`\n${issue.code}\n\`\`\`` : ''}

---

*This issue was automatically created by Sweep Agent.*
                `;
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['security', 'critical', 'sweep-agent', 'automated']
                });
              }
            }

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.scan_type == 'security'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔒 Run security audit
        run: |
          npm audit --audit-level=moderate --json > security-audit.json || true
      
      - name: 🛡️ Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      
      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            security-audit.json
            ${{ env.SWEEP_REPORTS_DIR }}/
          retention-days: 30

  performance-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.scan_type == 'performance'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build application
        run: npm run build
      
      - name: 📊 Bundle analysis
        run: |
          npx webpack-bundle-analyzer .next/static/chunks/*.js --report --mode static --no-open || true
      
      - name: ⚡ Performance testing
        run: |
          # Run Lighthouse CI if available
          if command -v lhci &> /dev/null; then
            lhci autorun
          else
            echo "Lighthouse CI not available"
          fi
      
      - name: 📈 Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            .lighthouseci/
            bundle-analysis-report.html
            ${{ env.SWEEP_REPORTS_DIR }}/
          retention-days: 30

  quality-gate:
    runs-on: ubuntu-latest
    needs: [sweep-analysis, security-scan, performance-scan]
    if: always()
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 📊 Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      
      - name: 🔍 Analyze combined results
        run: |
          echo "Analyzing combined sweep results..."
          
          # Check if any critical issues were found
          CRITICAL_ISSUES=0
          HIGH_ISSUES=0
          
          # Count issues from all reports
          for report_dir in all-reports/*/; do
            if [ -f "$report_dir/sweep-report.json" ]; then
              CRITICAL=$(jq '[.issues[] | select(.severity == "critical")] | length' "$report_dir/sweep-report.json" 2>/dev/null || echo "0")
              HIGH=$(jq '[.issues[] | select(.severity == "high")] | length' "$report_dir/sweep-report.json" 2>/dev/null || echo "0")
              
              CRITICAL_ISSUES=$((CRITICAL_ISSUES + CRITICAL))
              HIGH_ISSUES=$((HIGH_ISSUES + HIGH))
            fi
          done
          
          echo "Critical issues: $CRITICAL_ISSUES"
          echo "High issues: $HIGH_ISSUES"
          
          # Set quality gate status
          if [ $CRITICAL_ISSUES -gt 0 ]; then
            echo "QUALITY_GATE_STATUS=fail" >> $GITHUB_ENV
            echo "❌ Quality gate failed: Critical issues found"
          elif [ $HIGH_ISSUES -gt 5 ]; then
            echo "QUALITY_GATE_STATUS=fail" >> $GITHUB_ENV
            echo "❌ Quality gate failed: Too many high-severity issues"
          else
            echo "QUALITY_GATE_STATUS=pass" >> $GITHUB_ENV
            echo "✅ Quality gate passed"
          fi
      
      - name: 📢 Notify quality gate result
        if: always()
        run: |
          if [ "$QUALITY_GATE_STATUS" = "fail" ]; then
            echo "🚨 Quality gate failed - deployment blocked"
            exit 1
          else
            echo "✅ Quality gate passed - deployment approved"
          fi
      
      - name: 📊 Create quality report
        run: |
          mkdir -p quality-report
          
          cat > quality-report/quality-summary.md << EOF
          # Quality Gate Report
          
          **Status:** $QUALITY_GATE_STATUS
          **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          ## Summary
          
          Critical Issues: $CRITICAL_ISSUES
          High Issues: $HIGH_ISSUES
          
          ## Recommendations
          
          $(if [ $CRITICAL_ISSUES -gt 0 ]; then
            echo "- 🚨 Address critical security issues immediately"
          fi)
          
          $(if [ $HIGH_ISSUES -gt 5 ]; then
            echo "- ⚠️ Reduce high-severity issues to improve code quality"
          fi)
          
          EOF
      
      - name: 📤 Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: quality-report/
          retention-days: 30
